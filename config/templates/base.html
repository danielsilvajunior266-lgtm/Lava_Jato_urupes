<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Lava Jato Urupes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">

            <a class="navbar-brand" href="{% url 'home' %}">Lava Jato ETEC Urupes</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="clientesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Clientes
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="clientesDropdown">
                            <li><a class="dropdown-item" href="{% url 'pessoafisica_list' %}">Pessoa Física</a></li>
                            <li><a class="dropdown-item" href="{% url 'pessoajuridica_list' %}">Pessoa Jurídica</a></li>
                        </ul>
                    </li>                    

                    <li class="nav-item"><a class="nav-link" href="{% url 'veiculo_list' %}">Veículos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'servico_list' %}">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'movimento_list' %}">Movimentos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'painel_pagamentos' %}">Caixa</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                </ul>                

                {% if request.user.is_authenticated %}
                    <div class="d-flex align-items-center text-white">                    
                        <span>Olá, {{ request.user.username }}</span>
                        <form method="post" action="{% url 'logout' %}" class="d-inline ms-3">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-white text-decoration-none p-0">
                                Sair
                            </button>
                        </form>
                    </div>
                {% endif %}    
            </div>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}        
        {% endblock %}
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">

    </script>
</body>
</html>
